<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>契約管理システム</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.19.0/iconfont/tabler-icons.min.css">
<style>
:root{
  --font-sans: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f5f5;
  --color-background-danger: #fee2e2;
  --color-background-warning: #fef9c3;
  --color-background-success: #dcfce7;
  --color-background-info: #dbeafe;
  --color-text-primary: #111827;
  --color-text-secondary: #6b7280;
  --color-text-danger: #dc2626;
  --color-text-warning: #ca8a04;
  --color-text-success: #16a34a;
  --color-text-info: #2563eb;
  --color-border-tertiary: #e5e7eb;
  --color-border-secondary: #d1d5db;
  --border-radius-md: 6px;
  --border-radius-lg: 10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#f9fafb;color:var(--color-text-primary);padding:1rem}
.app{max-width:1200px;margin:0 auto;padding:1rem 0}
h1{font-size:18px;font-weight:600;margin-bottom:1.25rem;color:var(--color-text-primary)}
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap}
.tab{padding:7px 14px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary);font-weight:500}
.section{display:none}.section.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:1.25rem}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.85rem;text-align:center}
.metric-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:5px}
.metric-value{font-size:20px;font-weight:500}
.metric-value.danger{color:var(--color-text-danger)}
.metric-value.warning{color:var(--color-text-warning)}
.metric-value.success{color:var(--color-text-success)}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem}
.card-title{font-size:14px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.alert-item:last-child{border-bottom:none}
.badge{font-size:11px;padding:2px 7px;border-radius:var(--border-radius-md);white-space:nowrap;font-weight:500}
.badge-danger{background:var(--color-background-danger);color:var(--color-text-danger)}
.badge-warning{background:var(--color-background-warning);color:var(--color-text-warning)}
.badge-success{background:var(--color-background-success);color:var(--color-text-success)}
.badge-info{background:var(--color-background-info);color:var(--color-text-info)}
.badge-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.controls{display:flex;gap:6px;margin-bottom:.85rem;flex-wrap:wrap;align-items:center}
.controls input,.controls select{font-size:12px;padding:5px 8px;height:30px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:#fff}
.controls input{flex:1;min-width:100px}
.btn{font-size:12px;padding:5px 10px;cursor:pointer;height:30px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:var(--border-radius-md);border:none}
.btn-primary{background:var(--color-text-primary);color:#fff}
.btn-outline{background:none;border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary)}
.btn-outline:hover{background:var(--color-background-secondary)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.tbl th{text-align:left;padding:7px 6px;color:var(--color-text-secondary);font-weight:500;border-bottom:0.5px solid var(--color-border-tertiary);font-size:11px}
.tbl td{padding:7px 6px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--color-background-secondary);cursor:pointer}
.days-left{font-size:11px;color:var(--color-text-secondary)}
.action-btn{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:15px;padding:2px 3px}
.action-btn:hover{color:var(--color-text-primary)}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:var(--border-radius-lg);padding:1.25rem;width:94%;max-width:580px;border:0.5px solid var(--color-border-tertiary);max-height:88vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:1rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:11px;color:var(--color-text-secondary)}
.form-group input,.form-group select,.form-group textarea{font-size:12px;padding:5px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}
.btn-cancel{background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;padding:5px 10px}
.detail-modal{max-width:640px}
.detail-row{display:flex;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{width:130px;min-width:130px;color:var(--color-text-secondary);font-size:12px}
.detail-value{flex:1;word-break:break-all}
.sheet-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:.75rem}
.sheet-tab{font-size:11px;padding:3px 9px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);cursor:pointer;background:none;color:var(--color-text-secondary)}
.sheet-tab.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary)}
.pagination{display:flex;align-items:center;gap:8px;margin-top:.75rem;font-size:12px;color:var(--color-text-secondary);justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
<h1><i class="ti ti-file-text"></i> 契約管理システム</h1>
<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i> ダッシュボード</button>
  <button class="tab" onclick="switchTab('contracts')"><i class="ti ti-file-text"></i> 契約一覧</button>
</div>

<div id="dashboard" class="section active">
  <div class="metrics" id="metrics"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
    <div class="card" style="margin:0">
      <div class="card-title"><i class="ti ti-bell" style="color:#dc2626"></i> 期限アラート（90日以内）</div>
      <div id="alerts"></div>
    </div>
    <div class="card" style="margin:0">
      <div class="card-title"><i class="ti ti-refresh" style="color:#2563eb"></i> 継続中 契約（期限なし）</div>
      <div id="active-list"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><i class="ti ti-chart-bar"></i> シート別 件数</div>
    <div id="sheet-stats" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  </div>
</div>

<div id="contracts" class="section">
  <div class="sheet-tabs" id="sheet-tabs"></div>
  <div class="controls">
    <input type="text" id="search" placeholder="会社名・契約書名・担当者・契約番号で検索..." oninput="renderTable()">
    <select id="filter-status" onchange="renderTable()">
      <option value="">すべてのステータス</option>
      <option>継続中</option><option>終了</option><option>要確認</option><option>期限切れ</option>
    </select>
    <button class="btn btn-primary" onclick="openAddModal()"><i class="ti ti-plus"></i> 追加</button>
  </div>
  <div style="font-size:12px;color:#6b7280;margin-bottom:6px" id="result-count"></div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table class="tbl">
      <colgroup>
        <col style="width:7%"><col style="width:16%"><col style="width:18%"><col style="width:12%">
        <col style="width:11%"><col style="width:10%"><col style="width:9%"><col style="width:5%">
      </colgroup>
      <thead><tr>
        <th>番号</th><th>会社名</th><th>契約書名</th><th>担当者</th>
        <th>満了日</th><th>シート</th><th>ステータス</th><th></th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="detail-modal">
  <div class="modal detail-modal">
    <h3 id="detail-title"></h3>
    <div id="detail-body"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDetail()">閉じる</button>
      <button class="btn btn-primary" onclick="editFromDetail()"><i class="ti ti-edit"></i> 編集</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <h3 id="edit-modal-title">契約を編集</h3>
    <div class="form-grid">
      <div class="form-group full"><label>会社名（契約締結先）</label><input id="e-company" type="text"></div>
      <div class="form-group full"><label>契約書名</label><input id="e-docname" type="text"></div>
      <div class="form-group"><label>契約番号</label><input id="e-num" type="text"></div>
      <div class="form-group"><label>担当者</label><input id="e-pic" type="text"></div>
      <div class="form-group"><label>契約締結日</label><input id="e-signed" type="date"></div>
      <div class="form-group"><label>契約開始日</label><input id="e-start" type="date"></div>
      <div class="form-group"><label>契約満了日</label><input id="e-end" type="date"></div>
      <div class="form-group"><label>自動更新確認時期</label><input id="e-autocheck" type="text"></div>
      <div class="form-group"><label>契約更新期日</label><input id="e-renewdate" type="date"></div>
      <div class="form-group"><label>ステータス</label>
        <select id="e-status"><option value="">自動</option><option>継続中</option><option>終了</option><option>交渉中</option><option>保留</option></select>
      </div>
      <div class="form-group"><label>クラウドサイン</label><input id="e-cloudsign" type="text"></div>
      <div class="form-group"><label>更新回数</label><input id="e-renewcount" type="number"></div>
      <div class="form-group full"><label>備考</label><textarea id="e-memo" rows="2" style="resize:vertical"></textarea></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEdit()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()"><i class="ti ti-check"></i> 保存</button>
    </div>
  </div>
</div>

// ============================================================
// アプリロジック
// ============================================================
const today = new Date(); today.setHours(0,0,0,0);
function daysDiff(s){if(!s)return 9999;const d=new Date(s);if(isNaN(d))return 9999;d.setHours(0,0,0,0);return Math.round((d-today)/86400000);}
function fmt(s){if(!s)return'-';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0');}
function getStatus(c){
  if(c.status&&c.status!==''&&c.status!=='#VALUE!')return c.status;
  const d=daysDiff(c.end);if(d===9999)return'不明';
  if(d<0)return'期限切れ';if(d<=90)return'要確認';return'継続中';
}
function statusCls(s){
  if(s==='継続中')return'badge-success';if(s==='期限切れ')return'badge-danger';
  if(s==='要確認')return'badge-warning';if(s==='終了')return'badge-gray';return'badge-info';
}

let contracts=RAW_DATA.map((r,i)=>({...r,id:i+1}));
let nextId=contracts.length+1,editId=null,detailId=null,currentSheet='すべて',currentPage=1;
const PER_PAGE=30;
const SHEETS=['すべて',...[...new Set(RAW_DATA.map(r=>r.sheet))]];

function renderMetrics(){
  const total=contracts.length,active=contracts.filter(c=>getStatus(c)==='継続中').length;
  const warn=contracts.filter(c=>{const d=daysDiff(c.end);return d>=0&&d<=90;}).length;
  const expired=contracts.filter(c=>getStatus(c)==='期限切れ').length;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">総契約数</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">継続中</div><div class="metric-value success">${active}</div></div>
    <div class="metric"><div class="metric-label">90日以内に満了</div><div class="metric-value warning">${warn}</div></div>
    <div class="metric"><div class="metric-label">期限切れ</div><div class="metric-value danger">${expired}</div></div>`;
}
function renderAlerts(){
  const urgent=contracts.map(c=>({...c,d:daysDiff(c.end)})).filter(c=>c.d>=0&&c.d<=90).sort((a,b)=>a.d-b.d).slice(0,10);
  const el=document.getElementById('alerts');
  if(!urgent.length){el.innerHTML='<p style="font-size:12px;color:#6b7280;padding:6px 0">期限が近い契約はありません</p>';return;}
  el.innerHTML=urgent.map(c=>`<div class="alert-item">
    <span class="badge ${c.d<=30?'badge-danger':'badge-warning'}">${c.d}日後</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.company}</div>
      <div style="font-size:11px;color:#6b7280">${c.num} ・ ${fmt(c.end)}</div>
    </div></div>`).join('');
}
function renderActiveList(){
  const list=contracts.filter(c=>getStatus(c)==='継続中'&&!c.end).slice(0,8);
  const el=document.getElementById('active-list');
  el.innerHTML=list.map(c=>`<div class="alert-item">
    <span class="badge badge-success">継続中</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.company}</div>
      <div style="font-size:11px;color:#6b7280">${c.num} ・ ${c.sheet}</div>
    </div></div>`).join('')||'<p style="font-size:12px;color:#6b7280;padding:6px 0">該当なし</p>';
}
function renderSheetStats(){
  const counts={};contracts.forEach(c=>{counts[c.sheet]=(counts[c.sheet]||0)+1;});
  document.getElementById('sheet-stats').innerHTML=Object.entries(counts).map(([s,n])=>`
    <div style="background:#f5f5f5;border-radius:6px;padding:6px 12px;font-size:12px;display:flex;gap:8px;align-items:center">
      <span style="color:#6b7280">${s}</span><span style="font-weight:500">${n}件</span>
    </div>`).join('');
}
function renderSheetTabs(){
  document.getElementById('sheet-tabs').innerHTML=SHEETS.map(s=>`
    <button class="sheet-tab ${s===currentSheet?'active':''}" onclick="setSheet('${s}')">${s}</button>`).join('');
}
function setSheet(s){currentSheet=s;currentPage=1;renderTable();}
function getFiltered(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fs=document.getElementById('filter-status').value;
  return contracts.filter(c=>{
    const mQ=!q||c.company.toLowerCase().includes(q)||c.docname.toLowerCase().includes(q)||(c.pic||'').toLowerCase().includes(q)||c.num.toLowerCase().includes(q);
    const mS=!fs||getStatus(c)===fs;
    const mSheet=currentSheet==='すべて'||c.sheet===currentSheet;
    return mQ&&mS&&mSheet;
  });
}
function renderTable(){
  renderSheetTabs();
  const filtered=getFiltered(),total=filtered.length,pages=Math.ceil(total/PER_PAGE)||1;
  if(currentPage>pages)currentPage=1;
  const slice=filtered.slice((currentPage-1)*PER_PAGE,currentPage*PER_PAGE);
  document.getElementById('result-count').textContent=`${total}件中 ${Math.min((currentPage-1)*PER_PAGE+1,total)}〜${Math.min(currentPage*PER_PAGE,total)}件を表示`;
  document.getElementById('table-body').innerHTML=slice.map(c=>{
    const st=getStatus(c),d=daysDiff(c.end);
    return`<tr onclick="showDetail(${c.id})">
      <td title="${c.num}">${c.num}</td><td title="${c.company}">${c.company}</td>
      <td title="${c.docname}">${c.docname}</td><td title="${c.pic||''}">${c.pic||'-'}</td>
      <td><div>${fmt(c.end)}</div><div class="days-left">${d===9999?'':d<0?Math.abs(d)+'日超過':d+'日後'}</div></td>
      <td><span class="badge badge-gray" style="font-size:10px">${c.sheet}</span></td>
      <td><span class="badge ${statusCls(st)}">${st}</span></td>
      <td><button class="action-btn" onclick="event.stopPropagation();openEditModal(${c.id})" aria-label="編集"><i class="ti ti-edit"></i></button></td>
    </tr>`;
  }).join('')||'<tr><td colspan="8" style="text-align:center;color:#6b7280;padding:1.5rem;font-size:12px">該当なし</td></tr>';
  let pag='';
  if(pages>1){
    pag+=`<span>全${pages}ページ</span>`;
    if(currentPage>1)pag+=`<button class="btn btn-outline" onclick="gotoPage(${currentPage-1})">前へ</button>`;
    pag+=`<span>${currentPage}/${pages}</span>`;
    if(currentPage<pages)pag+=`<button class="btn btn-outline" onclick="gotoPage(${currentPage+1})">次へ</button>`;
  }
  document.getElementById('pagination').innerHTML=pag;
}
function gotoPage(p){currentPage=p;renderTable();}
function showDetail(id){
  const c=contracts.find(x=>x.id===id);if(!c)return;
  detailId=id;
  document.getElementById('detail-title').textContent=c.company;
  const rows=[['契約番号',c.num],['シート',c.sheet],['契約書名',c.docname],['担当者',c.pic||'-'],
    ['契約締結日',fmt(c.signed)],['契約開始日',fmt(c.start)],['契約満了日',fmt(c.end)],
    ['自動更新確認時期',c.autocheck||'-'],['契約更新期日',fmt(c.renewdate)],
    ['ステータス',getStatus(c)],['クラウドサイン',c.cloudsign||'-'],['更新回数',c.renewcount||'-'],['備考',c.memo||'-']];
  document.getElementById('detail-body').innerHTML=rows.map(([l,v])=>`
    <div class="detail-row"><div class="detail-label">${l}</div><div class="detail-value">${v}</div></div>`).join('');
  document.getElementById('detail-modal').classList.add('open');
}
function closeDetail(){document.getElementById('detail-modal').classList.remove('open');}
function editFromDetail(){closeDetail();openEditModal(detailId);}
function openEditModal(id){
  editId=id;const c=contracts.find(x=>x.id===id);
  document.getElementById('edit-modal-title').textContent='契約を編集';
  document.getElementById('e-company').value=c.company;document.getElementById('e-docname').value=c.docname;
  document.getElementById('e-num').value=c.num;document.getElementById('e-pic').value=c.pic||'';
  document.getElementById('e-signed').value=c.signed||'';document.getElementById('e-start').value=c.start||'';
  document.getElementById('e-end').value=c.end||'';document.getElementById('e-autocheck').value=c.autocheck||'';
  document.getElementById('e-renewdate').value=c.renewdate||'';document.getElementById('e-status').value=c.status||'';
  document.getElementById('e-cloudsign').value=c.cloudsign||'';document.getElementById('e-renewcount').value=c.renewcount||'';
  document.getElementById('e-memo').value=c.memo||'';
  document.getElementById('edit-modal').classList.add('open');
}
function openAddModal(){
  editId=null;document.getElementById('edit-modal-title').textContent='契約を追加';
  ['e-company','e-docname','e-num','e-pic','e-signed','e-start','e-end','e-autocheck','e-renewdate','e-cloudsign','e-renewcount','e-memo'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('e-status').value='';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit(){document.getElementById('edit-modal').classList.remove('open');}
function saveEdit(){
  const data={company:document.getElementById('e-company').value.trim(),docname:document.getElementById('e-docname').value.trim(),
    num:document.getElementById('e-num').value.trim(),pic:document.getElementById('e-pic').value.trim(),
    signed:document.getElementById('e-signed').value,start:document.getElementById('e-start').value,
    end:document.getElementById('e-end').value,autocheck:document.getElementById('e-autocheck').value.trim(),
    renewdate:document.getElementById('e-renewdate').value,status:document.getElementById('e-status').value,
    cloudsign:document.getElementById('e-cloudsign').value.trim(),renewcount:document.getElementById('e-renewcount').value,
    memo:document.getElementById('e-memo').value};
  if(!data.company){alert('会社名は必須です');return;}
  if(editId){const i=contracts.findIndex(c=>c.id===editId);contracts[i]={...contracts[i],...data};}
  else contracts.push({id:nextId++,sheet:'手動追加',...data});
  closeEdit();renderAll();renderTable();
}
[document.getElementById('detail-modal'),document.getElementById('edit-modal')].forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');});
});
function switchTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['dashboard','contracts'][i]===id));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='contracts'){renderSheetTabs();renderTable();}
}
function renderAll(){renderMetrics();renderAlerts();renderActiveList();renderSheetStats();}
renderAll();
</script>
